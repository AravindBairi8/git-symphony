[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "git-symphony"
version = "0.1.0"
description = "Turn any git repository's commit history into music: WAV, MIDI, or an interactive HTML player."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = ["git", "music", "sonification", "midi", "visualization", "generative-music"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
gitsymphony = "gitsymphony.cli:main"

[tool.setuptools]
packages = ["gitsymphony"]
